[tools]
age = "1.3.2"
ansible-core = "2.21.5"
# Same version as the pre-commit hook; its own venv gets the same ansible-core.
"pipx:ansible-lint" = { version = "26.10.1", uvx_args = "--with ansible-core==2.21.5" }
cilium-cli = "0.19.5"
gitleaks = "8.30.1"
helm = "3.16.4"
kubeseal = "0.40.0"
packer = "1.16.2"
pre-commit = "4.7.0"
sops = "3.13.3"

[env]
KUBECONFIG = "{{env.HOME}}/.kube/configs/k3s.yaml"
# The age private key lives outside the repo; only public keys are
# committed (see .sops.yaml).
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
CONTAINER_ENGINE = "docker"
AIA_IMAGE = "localhost/proxmox-auto-install-assistant:9.0.7"

[tasks.network-install]
description = "Bootstrap Cilium CNI + LoadBalancer pool (no kube-proxy)"
run = """
set -euo pipefail

# Auto-detect the control-plane InternalIP (kube-proxy is disabled, so
# Cilium needs the API server address directly). Mirrors the old
# Terraform locals.master_internal_ip lookup.
MASTER_IP="$(kubectl get nodes \
  -l node-role.kubernetes.io/control-plane \
  -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')"
echo "Detected control-plane InternalIP: ${MASTER_IP}"

# UFW blocks pod->node traffic: pods reaching the API (ClusterIP ->
# node:6443) arrive via lxc* on the INPUT chain and hit UFW's default
# deny, so CoreDNS and others can never reach the API. Allow the pod and
# service CIDRs. k3s defaults: pods 10.42.0.0/16, services 10.43.0.0/16.
if command -v ufw >/dev/null && sudo ufw status | grep -q "Status: active"; then
  sudo ufw allow from 10.42.0.0/16 comment 'k8s pod CIDR'
  sudo ufw allow from 10.43.0.0/16 comment 'k8s service CIDR'
  sudo ufw reload
fi

helm repo add cilium https://helm.cilium.io --force-update
helm repo update cilium

helm upgrade --install cilium cilium/cilium \
  --version 1.19.5 \
  --namespace kube-system \
  --set k8sServiceHost="${MASTER_IP}" \
  -f k8s/network/cilium-values.yaml \
  --wait --timeout 300s

# The Cilium operator registers these CRDs asynchronously after it
# starts, so helm --wait is not enough. Wait until they are Established
# before applying the custom resources that depend on them.
kubectl wait --for condition=established --timeout=120s \
  crd/ciliumloadbalancerippools.cilium.io \
  crd/ciliuml2announcementpolicies.cilium.io

# LoadBalancer IP pool + L2 announcement policy.
kubectl apply -f k8s/network/cilium-lb.yaml

cilium status --wait
"""

[tasks.argocd-install]
description = "Bootstrap ArgoCD + app-of-apps root (GitOps takes over)"
run = """
set -euo pipefail

helm repo add argo https://argoproj.github.io/argo-helm
helm repo update argo

helm upgrade --install argocd argo/argo-cd \
  --version 10.10.3 \
  --namespace argocd --create-namespace \
  -f k8s/argocd/values.yaml \
  --wait --timeout 600s

# Hand control to GitOps: the root app-of-apps discovers every child
# Application under k8s/argocd/apps/ (Cilium, LB pool, and whatever you
# add next).
kubectl apply -f k8s/argocd/root-app.yaml

echo
echo "ArgoCD LoadBalancer IP:"
kubectl -n argocd get svc argocd-server \
  -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || true
echo
echo "Initial admin password:"
kubectl -n argocd get secret argocd-initial-admin-secret \
  -o jsonpath='{.data.password}' | base64 -d || true
echo
"""

[tasks.ghcr-make-public]
description = "Make the jupyter-singleuser GHCR package public (GitHub has no API for this; opens the settings page)"
run = """
set -euo pipefail

OWNER="aacecandev"
PKG="jupyter-singleuser"

# gh/REST exposes no endpoint to change package visibility (PATCH
# .../visibility returns 404), so it is a manual UI toggle. We use gh for
# what it CAN do — confirm the package exists and report its visibility —
# then open the exact settings page.
if gh api "/user/packages/container/${PKG}" >/dev/null 2>&1; then
  vis="$(gh api "/user/packages/container/${PKG}" -q .visibility)"
  echo "Package '${PKG}' current visibility: ${vis}"
  if [ "${vis}" = "public" ]; then
    echo "Already public — nothing to do."
    exit 0
  fi
else
  echo "Package '${PKG}' not found yet. Run the build workflow first:"
  echo "  gh workflow run build-jupyter-singleuser"
fi

URL="https://github.com/users/${OWNER}/packages/container/${PKG}/settings"
echo
echo "GitHub has no API to change package visibility — do it in the UI:"
echo "  Danger Zone -> Change visibility -> Public"
echo "  ${URL}"
command -v xdg-open >/dev/null && xdg-open "${URL}" >/dev/null 2>&1 || true
"""

[tasks.ansible-deps]
description = "Install the Ansible collections from ansible/requirements.yml"
dir = "ansible"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks.age-keygen]
description = "Create the age key used by sops (never overwrites an existing key)"
run = """
set -euo pipefail
if [ -e "${SOPS_AGE_KEY_FILE}" ]; then
  echo "Key already exists: ${SOPS_AGE_KEY_FILE}"
else
  mkdir -p "$(dirname "${SOPS_AGE_KEY_FILE}")"
  (umask 077 && age-keygen -o "${SOPS_AGE_KEY_FILE}")
fi
echo "Public key: $(age-keygen -y "${SOPS_AGE_KEY_FILE}")"
"""

[tasks.aia-build]
description = "Build the container image that ships proxmox-auto-install-assistant"
dir = "{{config_root}}/images/proxmox-ve-unnatended"
run = '${CONTAINER_ENGINE} build -t "${AIA_IMAGE}" -f Containerfile .'

[tasks.aia]
description = "Run proxmox-auto-install-assistant in images/proxmox-ve-unnatended (args are forwarded), e.g. mise run aia -- --help"
depends = ["aia-build"]
dir = "{{config_root}}/images/proxmox-ve-unnatended"
run = '${CONTAINER_ENGINE} run --rm --user "$(id -u):$(id -g)" -v "${PWD}:/work" "${AIA_IMAGE}"'

[tasks.pve-validate]
description = "Render and validate the Proxmox answer files for all hosts (needs real secrets in secrets.sops.env)"
depends = ["aia-build"]
dir = "{{config_root}}/images/proxmox-ve-unnatended"
run = """
set -euo pipefail
for host in beelink nas; do
  sops -d secrets.sops.env | scripts/build-iso.sh "${host}" --validate-only
done
"""

[tasks.pve-iso]
description = "Build the prepared Proxmox ISO for a host, e.g. mise run pve-iso -- beelink (output in build/, contains secrets)"
depends = ["aia-build"]
dir = "{{config_root}}/images/proxmox-ve-unnatended"
usage = 'arg "<host>" help="beelink or nas"'
run = """
set -euo pipefail
host="${usage_host:?usage: mise run pve-iso -- beelink|nas}"
sops -d secrets.sops.env | scripts/build-iso.sh "${host}"
"""

[tasks.golden-image-validate]
description = "Validate the Ubuntu 24.04 golden image Packer config (secrets from secrets.sops.env)"
dir = "{{config_root}}/images/proxmox-golden-image"
# validate never calls the Proxmox API, so the token can be a placeholder.
run = """
set -euo pipefail
packer init .
PKR_VAR_proxmox_token=unused sops exec-env secrets.sops.env 'packer validate .'
"""

[tasks.golden-image]
description = "Build the Ubuntu 24.04 golden image template on beelink (token from the 06_configure_users secrets)"
depends = ["golden-image-validate"]
dir = "{{config_root}}/images/proxmox-golden-image"
run = """
set -euo pipefail
PKR_VAR_proxmox_token="$(sops decrypt --extract '["pve_token_secrets"]["packer@pve!packer"]' \
  {{config_root}}/ansible/host_vars/beelink/pve_tokens.sops.yml)"
export PKR_VAR_proxmox_token
sops exec-env secrets.sops.env 'packer build .'
"""

[tasks.pve-usb]
description = "Write a host's prepared Proxmox ISO to a USB stick (builds it if missing), e.g. mise run pve-usb -- beelink /dev/sdX (erases the stick)"
depends = ["aia-build"]
dir = "{{config_root}}/images/proxmox-ve-unnatended"
raw = true
usage = '''
arg "<host>" help="beelink or nas"
arg "<device>" help="whole USB disk, e.g. /dev/sdb (not a partition)"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail
host="${usage_host:?usage: mise run pve-usb -- beelink|nas /dev/sdX}"
dev="${usage_device:?usage: mise run pve-usb -- beelink|nas /dev/sdX}"
iso="build/proxmox-ve_9.2-1-${host}.iso"

[ -b "${dev}" ] || { echo "${dev} is not a block device" >&2; exit 1; }

# Guard against wiping the wrong disk: only whole, removable/USB disks
# with nothing mounted are accepted.
[ "$(lsblk -dno TYPE "${dev}")" = "disk" ] || { echo "${dev} is not a whole disk" >&2; exit 1; }
if [ "$(lsblk -dno RM "${dev}" | tr -d ' ')" != "1" ] && [ "$(lsblk -dno TRAN "${dev}")" != "usb" ]; then
  echo "${dev} is neither removable nor USB; refusing" >&2; exit 1
fi
if lsblk -nro MOUNTPOINTS "${dev}" | grep -q .; then
  echo "${dev} has mounted partitions; unmount them first:" >&2
  lsblk -o NAME,SIZE,MOUNTPOINTS "${dev}" >&2; exit 1
fi

# Build the ISO on first use so one command takes a host to a bootable stick.
if [ ! -f "${iso}" ]; then
  echo "Building ${iso}..."
  sops -d secrets.sops.env | scripts/build-iso.sh "${host}"
fi

lsblk -o NAME,SIZE,TRAN,MODEL "${dev}"
echo
echo "ALL DATA on ${dev} will be erased and replaced by ${iso}."
read -r -p "Type the device path again to confirm: " answer
[ "${answer}" = "${dev}" ] || { echo "Aborted." >&2; exit 1; }

sudo dd if="${iso}" of="${dev}" bs=4M status=progress oflag=direct conv=fsync
sync
echo "Verifying..."
sudo cmp -n "$(stat -c%s "${iso}")" "${iso}" "${dev}"
echo "Done: ${dev} boots the ${host} unattended installer."
"""
