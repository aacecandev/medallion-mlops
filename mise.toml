[tools]
cilium-cli = "0.19.5"
gitleaks = "8.30.1"
helm = "3.16.4"
k3s = "1.36.2+k3s1"
pre-commit = "4.7.0"

[env]
KUBECONFIG = "{{env.HOME}}/.kube/configs/k3s.yaml"

[tasks.k3s-master-install]
description = "Install k3s master node"
run = """
curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.36.2+k3s1 INSTALL_K3S_EXEC='--flannel-backend=none --disable-network-policy --disable=traefik --disable=servicelb --disable-kube-proxy' sh -
mkdir -p ~/.kube/configs
sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/configs/k3s.yaml
sudo chown "$(id -u)":"$(id -g)" ~/.kube/configs/k3s.yaml
"""

[tasks.network-install]
description = "Bootstrap Cilium CNI + LoadBalancer pool (no kube-proxy)"
run = """
set -euo pipefail

# Auto-detect the control-plane InternalIP (kube-proxy is disabled, so
# Cilium needs the API server address directly). Mirrors the old
# Terraform locals.master_internal_ip lookup.
MASTER_IP="$(kubectl get nodes \
  -l node-role.kubernetes.io/control-plane \
  -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}')"
echo "Detected control-plane InternalIP: ${MASTER_IP}"

# UFW blocks pod->node traffic: pods reaching the API (ClusterIP ->
# node:6443) arrive via lxc* on the INPUT chain and hit UFW's default
# deny, so CoreDNS and others can never reach the API. Allow the pod and
# service CIDRs. k3s defaults: pods 10.42.0.0/16, services 10.43.0.0/16.
if command -v ufw >/dev/null && sudo ufw status | grep -q "Status: active"; then
  sudo ufw allow from 10.42.0.0/16 comment 'k8s pod CIDR'
  sudo ufw allow from 10.43.0.0/16 comment 'k8s service CIDR'
  sudo ufw reload
fi

helm repo add cilium https://helm.cilium.io --force-update
helm repo update cilium

helm upgrade --install cilium cilium/cilium \
  --version 1.19.5 \
  --namespace kube-system \
  --set k8sServiceHost="${MASTER_IP}" \
  -f k8s/network/cilium-values.yaml \
  --wait --timeout 300s

# The Cilium operator registers these CRDs asynchronously after it
# starts, so helm --wait is not enough. Wait until they are Established
# before applying the custom resources that depend on them.
kubectl wait --for condition=established --timeout=120s \
  crd/ciliumloadbalancerippools.cilium.io \
  crd/ciliuml2announcementpolicies.cilium.io

# LoadBalancer IP pool + L2 announcement policy.
kubectl apply -f k8s/network/cilium-lb.yaml

cilium status --wait
"""

[tasks.argocd-install]
description = "Bootstrap ArgoCD + app-of-apps root (GitOps takes over)"
run = """
set -euo pipefail

helm repo add argo https://argoproj.github.io/argo-helm
helm repo update argo

helm upgrade --install argocd argo/argo-cd \
  --version 10.10.3 \
  --namespace argocd --create-namespace \
  -f k8s/argocd/values.yaml \
  --wait --timeout 600s

# Hand control to GitOps: the root app-of-apps discovers every child
# Application under k8s/argocd/apps/ (Cilium, LB pool, and whatever you
# add next).
kubectl apply -f k8s/argocd/root-app.yaml

echo
echo "ArgoCD LoadBalancer IP:"
kubectl -n argocd get svc argocd-server \
  -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || true
echo
echo "Initial admin password:"
kubectl -n argocd get secret argocd-initial-admin-secret \
  -o jsonpath='{.data.password}' | base64 -d || true
echo
"""


[tasks.k3s-uninstall]
description = "Uninstall k3s + deep-clean Cilium leftovers (interfaces, iptables, BPF)"
run = """
# k3s-uninstall.sh stops k3s but does NOT clean Cilium's datapath. Stale
# cilium_* interfaces, CILIUM/OLD_CILIUM iptables chains and pinned BPF
# maps survive across reinstalls and break pod networking (ClusterIP and
# egress time out). This task removes all of it for a truly clean slate.
set +e

[ -x /usr/local/bin/k3s-uninstall.sh ] && sudo /usr/local/bin/k3s-uninstall.sh

# 1. Leftover datapath interfaces.
for i in cilium_vxlan cilium_net cilium_host; do sudo ip link delete "$i" 2>/dev/null; done

# 2. CILIUM + OLD_CILIUM iptables/ip6tables chains (handles quoted
#    comments and chain-to-chain jumps that a naive grep -v breaks).
sudo python3 - <<'PY'
import subprocess, shlex
run = lambda a: subprocess.run(a, capture_output=True, text=True)
for ipt in ("iptables", "ip6tables"):
    for t in ("raw", "mangle", "nat", "filter"):
        for line in run([ipt, "-t", t, "-S"]).stdout.splitlines():
            if line.startswith("-A") and "CILIUM" in line:
                p = shlex.split(line)
                tgt = p[p.index("-j")+1] if "-j" in p else (p[p.index("-g")+1] if "-g" in p else "")
                if "CILIUM" in tgt:
                    p[0] = "-D"; run([ipt, "-t", t] + p)
        S = run([ipt, "-t", t, "-S"]).stdout.splitlines()
        ch = [l.split()[1] for l in S if l.startswith("-N") and "CILIUM" in l.split()[1]]
        for c in ch: run([ipt, "-t", t, "-F", c])
        for c in ch: run([ipt, "-t", t, "-X", c])
PY

# 3. UFW rules opened by network-install for the cluster CIDRs.
if command -v ufw >/dev/null; then
  sudo ufw delete allow from 10.42.0.0/16 2>/dev/null
  sudo ufw delete allow from 10.43.0.0/16 2>/dev/null
fi

# 4. Pinned BPF maps + leftover CNI/Cilium/k3s state.
sudo rm -rf /sys/fs/bpf/cilium /sys/fs/bpf/tc/globals/cilium_* 2>/dev/null
sudo rm -rf /etc/cni/net.d /opt/cni /var/lib/cni /var/lib/cilium /run/cilium \
            /var/lib/rancher /etc/rancher 2>/dev/null
rm -f ~/.kube/configs/k3s.yaml

echo "Clean. Remaining cilium iptables rules: $(sudo iptables-save 2>/dev/null | grep -c CILIUM)"
"""

