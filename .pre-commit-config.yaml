# Pre-commit hooks. gitleaks runs as a local hook against the
# mise-pinned binary (gitleaks = "8.30.1" in mise.toml), so the version
# is reproducible and pre-commit never has to compile it with Go.
#
# Install once:  mise exec -- pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: fix-byte-order-marker
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace

  # Runs from ansible/ so it picks up ansible/.ansible-lint and ansible.cfg;
  # collections come from ansible/requirements.yml.
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.10.1
    hooks:
      - id: ansible-lint
        entry: sh -c 'cd ansible && ansible-lint'
        files: ^ansible/
        always_run: false

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan staged changes for secrets)
        entry: gitleaks git --staged --redact --verbose
        language: system
        pass_filenames: false
