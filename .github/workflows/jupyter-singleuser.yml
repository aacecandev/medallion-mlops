name: build-jupyter-singleuser

# Builds the custom JupyterHub single-user image and pushes it to GHCR.
# Bump IMAGE_TAG (and k8s/jupyterhub/values.yaml singleuser.image.tag) when
# the image contents change, so ArgoCD rolls the new version deterministically.
on:
  push:
    branches: [main]
    paths:
      - images/jupyter-singleuser/**
      - .github/workflows/jupyter-singleuser.yml
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/jupyter-singleuser
  IMAGE_TAG: "0.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/jupyter-singleuser
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
