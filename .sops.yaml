# sops looks for this file from the current directory upwards, so it lives at
# the repo root to work from anywhere in the tree. sops has no TOML support,
# so Proxmox installer secrets live in *.sops.env files and are rendered into
# answer files at build time. The private key is read from SOPS_AGE_KEY_FILE
# (set in mise.toml).
creation_rules:
  - path_regex: images/proxmox-ve-unnatended/.*\.sops\.(ya?ml|env)$
    age: age10zgfnnd70a8dg2trsyk4cch8jwt3qttxavgsz43z0t594sj5ssxqx4wh68
  - path_regex: images/proxmox-golden-image/.*\.sops\.env$
    age: age10zgfnnd70a8dg2trsyk4cch8jwt3qttxavgsz43z0t594sj5ssxqx4wh68
  - path_regex: ansible/(group|host)_vars/.*\.sops\.ya?ml$
    age: age10zgfnnd70a8dg2trsyk4cch8jwt3qttxavgsz43z0t594sj5ssxqx4wh68
