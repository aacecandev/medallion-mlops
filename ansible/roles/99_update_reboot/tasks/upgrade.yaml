# Deliberate full upgrade (Proxmox expects dist-upgrade, not upgrade), then a
# reboot only when a package asked for one. Run from the "upgrade" play.
- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  register: upgrade_result

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Reboot
  ansible.builtin.reboot:
    reboot_timeout: 900
    msg: Reboot after package upgrade (Ansible)
  when: reboot_required.stat.exists

- name: Read Proxmox version
  ansible.builtin.command: pveversion
  register: upgrade_pveversion
  changed_when: false
  check_mode: false

- name: Show Proxmox version
  ansible.builtin.debug:
    msg: "{{ upgrade_pveversion.stdout }} (rebooted: {{ reboot_required.stat.exists }})"
