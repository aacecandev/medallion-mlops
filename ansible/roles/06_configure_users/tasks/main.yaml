# Debian's default sudoers grants the sudo group full access (with password).
- name: Install sudo
  ansible.builtin.apt:
    name: sudo
    state: present

- name: Create admin user
  ansible.builtin.user:
    name: "{{ admin_user }}"
    password: "{{ admin_user_password_hash }}"
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true

- name: Authorize admin user SSH keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    path: /home/{{ admin_user }}/.ssh/authorized_keys # explicit so check mode works before the user exists
    key: "{{ admin_user_ssh_keys | join('\n') }}"
    exclusive: true

- name: List Proxmox users
  ansible.builtin.command: pveum user list --output-format json
  register: pveum_users
  changed_when: false
  check_mode: false

- name: Create Proxmox users
  ansible.builtin.command: pveum user add {{ item.userid }} --comment "{{ item.comment }}"
  loop: "{{ [{'userid': admin_user ~ '@pam', 'comment': 'Admin user (managed by Ansible)'}] + pve_service_users }}"
  loop_control:
    label: "{{ item.userid }}"
  when: item.userid not in (pveum_users.stdout | from_json | map(attribute='userid'))
  changed_when: true

- name: API tokens
  ansible.builtin.include_tasks: tokens.yaml

- name: List Proxmox roles
  ansible.builtin.command: pveum role list --output-format json
  register: pveum_roles
  changed_when: false
  check_mode: false

# Roles must exist before the ACLs below reference them; modify replaces the privilege set.
- name: Create or update custom Proxmox roles
  ansible.builtin.command: >-
    pveum role {{ 'modify' if current is not none else 'add' }} {{ item.name }}
    --privs {{ item.privs | sort | join(',') }}
  loop: "{{ pve_custom_roles }}"
  loop_control:
    label: "{{ item.name }}"
  when: current is none or current_privs | sort != item.privs | sort
  changed_when: true
  vars:
    current: >-
      {{ pveum_roles.stdout | from_json | selectattr('roleid', 'eq', item.name) | first | default(none) }}
    # pveum reports privs as a comma-separated string; accept a list too.
    current_privs: >-
      {{ [] if current is none
         else (current.privs.split(',') if current.privs is string else current.privs) }}

- name: List Proxmox ACLs
  ansible.builtin.command: pveum acl list --output-format json
  register: pveum_acls
  changed_when: false
  check_mode: false

# A privilege-separated token gets the intersection of its own ACLs and its user's.
- name: Grant Proxmox roles on /
  ansible.builtin.command: pveum acl modify / --{{ item.kind }} {{ item.ugid }} --roles {{ item.role }}
  loop: "{{ pve_desired_acls }}"
  loop_control:
    label: "{{ item.ugid }} {{ item.role }}"
  when: >-
    pveum_acls.stdout | from_json
    | selectattr('path', 'eq', '/')
    | selectattr('ugid', 'eq', item.ugid)
    | selectattr('roleid', 'eq', item.role)
    | list | length == 0
  changed_when: true
  vars:
    pve_desired_acls: |-
      {% set acls = [{'kind': 'users', 'ugid': admin_user ~ '@pam', 'role': admin_user_pve_role}] %}
      {% for su in pve_service_users %}
      {%   set _ = acls.append({'kind': 'users', 'ugid': su.userid, 'role': su.role}) %}
      {%   set _ = acls.append({'kind': 'tokens', 'ugid': su.userid ~ '!' ~ su.token, 'role': su.role}) %}
      {% endfor %}
      {{ acls }}
