# Managed by Ansible (18_fail2ban). Failed web UI / API logins, logged by pvedaemon as:
# pvedaemon[1234]: authentication failure; rhost=::ffff:192.0.2.10 user=root@pam msg=...
[Definition]
failregex = pvedaemon\[\d+\]: authentication failure; rhost=<HOST> user=\S* msg=.*$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=pvedaemon.service
