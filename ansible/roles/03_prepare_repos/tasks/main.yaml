# PVE 9 uses deb822 .sources files. Without a subscription the enterprise
# repositories answer 401, so they are kept but disabled and the
# no-subscription repository is added.
- name: Disable Proxmox enterprise repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: [deb]
    uris: "{{ item.uri }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: ["{{ item.component }}"]
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
    enabled: false
  loop:
    - { name: pve-enterprise, uri: https://enterprise.proxmox.com/debian/pve, component: pve-enterprise }
    - { name: ceph, uri: https://enterprise.proxmox.com/debian/ceph-squid, component: enterprise }
  loop_control:
    label: "{{ item.name }}"
  notify: Update apt cache

- name: Add Proxmox no-subscription repository
  ansible.builtin.deb822_repository:
    name: proxmox
    types: [deb]
    uris: http://download.proxmox.com/debian/pve
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [pve-no-subscription]
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg
  notify: Update apt cache

- name: Apply repository changes now
  ansible.builtin.meta: flush_handlers
