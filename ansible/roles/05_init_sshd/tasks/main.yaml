- name: Configure sshd hardening drop-in
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Apply sshd changes now
  ansible.builtin.meta: flush_handlers

# Fails the play if the drop-in did not take effect.
- name: Read effective sshd settings
  ansible.builtin.command: /usr/sbin/sshd -T
  register: sshd_effective
  changed_when: false
  check_mode: false

- name: Verify effective sshd settings
  ansible.builtin.assert:
    that:
      - "'permitrootlogin ' ~ sshd_permit_root_login in sshd_effective.stdout_lines"
      - "'passwordauthentication ' ~ ('yes' if sshd_password_authentication else 'no') in sshd_effective.stdout_lines"
    quiet: true
  when: not ansible_check_mode
