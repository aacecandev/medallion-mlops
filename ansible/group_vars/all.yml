---
# 02_date_timezone
timezone: Europe/Madrid
ntp_servers:
  - es.pool.ntp.org

# 05_init_sshd: root stays reachable with keys only (Ansible and Proxmox tooling use it)
sshd_permit_root_login: prohibit-password
sshd_password_authentication: false

# 06_configure_users (admin_user_password_hash lives in all.sops.yml)
admin_user: alejandro
admin_user_pve_role: Administrator
admin_user_ssh_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDKwFgVMjJtsFt0vn0AM9Q10RJkgByxevhJY9kRQyH9U cardno:32_247_877

# 06_configure_users: custom Proxmox roles, kept in sync with this privilege list.
# PVE 9 dropped VM.Monitor; guest agent reads need VM.GuestAgent.Audit instead.
pve_custom_roles:
  - name: Packer # proxmox-iso builder: create, configure, boot and templatize a VM
    privs:
      - Datastore.AllocateSpace # VM disk and cloud-init drive
      - Datastore.Audit # read the installer ISO
      - SDN.Use # attach the NIC to the bridge
      - VM.Allocate # create the VM and convert it to a template
      - VM.Audit
      - VM.Config.CDROM
      - VM.Config.CPU
      - VM.Config.Cloudinit
      - VM.Config.Disk
      - VM.Config.HWType
      - VM.Config.Memory
      - VM.Config.Network
      - VM.Config.Options
      - VM.Console # sendkey for the boot command
      - VM.GuestAgent.Audit # read guest IPs through the agent
      - VM.PowerMgmt

# 06_configure_users: Proxmox-only service users, one privilege-separated token each.
# Secrets land in host_vars/<host>/pve_tokens.sops.yml as pve_token_secrets["<userid>!<token>"].
pve_service_users:
  - userid: terraform@pve
    comment: OpenTofu/Terraform provider (managed by Ansible)
    role: Administrator # narrow to a custom role later
    token: terraform
  - userid: packer@pve
    comment: Packer golden image builds (managed by Ansible)
    role: Packer
    token: packer
  - userid: monitoring@pve
    comment: Prometheus pve-exporter (managed by Ansible)
    role: PVEAuditor
    token: exporter

# 13_ksmtuned: on for VM hosts; override per host in host_vars.
ksmtuned_enabled: true
ksmtuned_settings: {} # e.g. {KSM_THRES_COEF: 30}; empty keeps ksmtuned defaults

# 18_fail2ban: bans after maxretry failures within findtime (SSH and Proxmox web/API logins).
fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5
fail2ban_ignoreip: # never banned; recover from a self-ban on the console with: fail2ban-client unban --all
  - 127.0.0.1/8
  - ::1

# 22_mail: all host mail relays through Google Workspace.
# admin_email, mail_relay_user and mail_relay_password live in all.sops.yml.
mail_relayhost: "[smtp.gmail.com]:587"

# 04_install_software: CPU microcode is added automatically from global_cpu_vendor.
base_packages:
  - htop
  - iotop
  - ncdu
  - tmux
  - vim
  - jq
  - rsync
  - curl
  - lm-sensors
extra_packages: [] # per-host additions in host_vars/<host>/main.yml

# 10_zfs_storage: pools/datasets per host in host_vars; 0 keeps PVE's ARC limit.
zfs_pools: []
zfs_datasets: []
zfs_arc_max_bytes: 0

# 29_smartd: temperature thresholds in C; self-tests in smartd -s syntax
# (short every Sunday 03:00, long on day 1 of each month 04:00).
smartd_test_schedule: S/../../7/03|L/../01/./04
smartd_temp_diff: 4
smartd_temp_info: 45
smartd_temp_crit: 55

# 25_upload_isos: installer ISOs per host in host_vars, as {url, checksum}.
pve_isos: []

# 26_nfs_storage: exports and Proxmox NFS storages per host in host_vars.
nfs_exports: []
pve_nfs_storages: []

# 40_pc_backup (pc-backup.yml): nightly rsync of the PC's data disk to the NAS,
# versioned there with sanoid snapshots. Target host: inventory group pc_backup_target.
pc_backup_source: /mnt/external-data
pc_backup_dataset: datapool/data/pc
pc_backup_user: pc-backup
pc_backup_schedule: "*-*-* 01:30:00"
pc_backup_excludes:
  - "$RECYCLE.BIN/"
  - "System Volume Information/"
  - ".Trash-*/"
pc_backup_snapshots: # sanoid retention
  daily: 7
  weekly: 4
  monthly: 6

# 27_backup_jobs: Proxmox backup jobs per host in host_vars.
pve_backup_jobs: []
