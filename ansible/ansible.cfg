[defaults]
executable = /bin/bash
stdout_callback = default
inventory = inventory.yml
roles_path = roles
interpreter_python = /usr/bin/python3
interpreter_discovery = true
private_key_file = ~/.ssh/yubikey.pub
# Decrypts group_vars/host_vars *.sops.yml with the age key in SOPS_AGE_KEY_FILE
vars_plugins_enabled = host_group_vars,community.sops.sops
[ssh_connection]
pipelining = True
# Host keys are pinned in known_hosts (relative to ansible/, where this file is read).
# IdentitiesOnly keeps ssh to the YubiKey key from private_key_file.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=30m -o IdentitiesOnly=yes -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes
