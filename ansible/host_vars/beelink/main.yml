---
# 25_upload_isos: installer for the Packer golden image (ubuntu_image in
# images/proxmox-golden-image/variables.auto.pkrvars.hcl must match the filename).
pve_isos:
  - url: https://releases.ubuntu.com/24.04.3/ubuntu-24.04.3-live-server-amd64.iso
    checksum: sha256:c3514bf0056180d09376462a7a1b4f213c1d6e8ea67fae5c25099c6fd3d8274b

# 26_nfs_storage: NAS backups dataset as Proxmox storage, backups only.
pve_nfs_storages:
  - id: nas-backups
    server: 192.168.1.138
    export: /datapool/backups
    content: backup

# 27_backup_jobs: every guest nightly to the NAS. legacy-sendmail mails only on
# failure, per job, to root (aliased by 22_mail) without changing the
# notification matcher that routes all other Proxmox notifications.
pve_backup_jobs:
  - id: nightly-guests
    options:
      schedule: "02:00"
      storage: nas-backups
      all: "1"
      mode: snapshot
      compress: zstd
      prune-backups: keep-daily=7,keep-monthly=6,keep-weekly=4 # sorted keys, as compared
      notification-mode: legacy-sendmail
      mailnotification: failure
      mailto: root
      comment: Managed by Ansible (27_backup_jobs)
