# Run one role with --tags, e.g. ansible-playbook proxmox.yml --tags sshd
# (init always runs, later roles depend on its facts).
- name: Prepare proxmox
  hosts: proxmox
  tasks:
    - name: Init
      ansible.builtin.import_role:
        name: 00_init
      tags: [always]

    - name: Date and timezone
      ansible.builtin.import_role:
        name: 02_date_timezone
      tags: [timezone]

    - name: APT repositories
      ansible.builtin.import_role:
        name: 03_prepare_repos
      tags: [repos]

    - name: Base packages
      ansible.builtin.import_role:
        name: 04_install_software
      tags: [packages]

    - name: SSH server
      ansible.builtin.import_role:
        name: 05_init_sshd
      tags: [sshd]

    - name: Users
      ansible.builtin.import_role:
        name: 06_configure_users
      tags: [users]

    - name: ZFS storage
      ansible.builtin.import_role:
        name: 10_zfs_storage
      tags: [zfs]

    - name: KSM tuning
      ansible.builtin.import_role:
        name: 13_ksmtuned
      tags: [ksmtuned]

    - name: Fail2ban
      ansible.builtin.import_role:
        name: 18_fail2ban
      tags: [fail2ban]

    - name: Mail relay
      ansible.builtin.import_role:
        name: 22_mail
      tags: [mail]

    - name: ISO images
      ansible.builtin.import_role:
        name: 25_upload_isos
      tags: [isos]

    - name: NFS storage
      ansible.builtin.import_role:
        name: 26_nfs_storage
      tags: [nfs]

    - name: Backup jobs
      ansible.builtin.import_role:
        name: 27_backup_jobs
      tags: [backups]

    - name: Node exporter
      ansible.builtin.import_role:
        name: 28_node_exporter
      tags: [node_exporter]

    - name: SMART monitoring
      ansible.builtin.import_role:
        name: 29_smartd
      tags: [smartd]

    - name: Unattended security updates
      ansible.builtin.import_role:
        name: 99_update_reboot
      tags: [updates]

# Opt-in only: ansible-playbook proxmox.yml --tags upgrade [--limit <host>]
# Full upgrade plus reboot if needed, one host at a time.
- name: Upgrade packages
  hosts: proxmox
  serial: 1
  tasks:
    - name: Upgrade and reboot
      ansible.builtin.import_role:
        name: 99_update_reboot
        tasks_from: upgrade.yaml
      tags: [never, upgrade]
