# Sealed Secrets controller — GitOps-safe secret management.
# We commit encrypted `SealedSecret` CRDs to this repo; the controller
# decrypts them into native Secrets in-cluster. Nothing sensitive ever
# lands in git in plaintext.
#
# fullnameOverride matches kubeseal's default controller name
# (`sealed-secrets-controller` in `kube-system`) so the CLI works with no
# extra flags.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.20.0
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/k8s/sealed-secrets/values.yaml
    - repoURL: https://github.com/aacecandev/medallion-mlops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
