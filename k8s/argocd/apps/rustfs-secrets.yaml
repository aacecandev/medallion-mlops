# Encrypted RustFS credentials (SealedSecret CRDs).
# ArgoCD syncs the sealed manifests under k8s/rustfs/secrets/; the
# Sealed Secrets controller decrypts them into native Secrets:
#   - rustfs-root          (rustfs ns)      -> RustFS root credentials
#   - rustfs-bronze-creds  (rustfs ns)      -> bronze bucket access key
#   - rustfs-silver-creds  (rustfs ns)      -> silver bucket access key
#   - rustfs-gold-creds    (rustfs ns)      -> gold bucket access key
#   - rustfs-mlflow-creds  (rustfs ns)      -> mlflow bucket access key
#   - rustfs-bronze-creds  (jupyterhub ns)  -> bronze creds for EDA
#   - rustfs-mlflow-creds  (mlflow ns)      -> mlflow bucket creds for MLflow
#
# The sealed files are generated with k8s/rustfs/secrets/seal.sh against
# your cluster's controller and committed here (safe: they are encrypted).
# sync-wave 1 runs before RustFS (wave 2) so the root Secret exists first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/aacecandev/medallion-mlops
    targetRevision: main
    path: k8s/rustfs/secrets
    directory:
      recurse: false
      include: "*-sealed.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: rustfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
