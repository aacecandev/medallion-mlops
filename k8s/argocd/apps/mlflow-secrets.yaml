# Encrypted MLflow credentials (SealedSecret CRDs).
# ArgoCD syncs the sealed manifests under k8s/mlflow/secrets/; the Sealed
# Secrets controller decrypts them into native Secrets:
#   - mlflow-postgres  (mlflow ns, basic-auth) -> Postgres owner creds,
#       consumed BOTH by the CloudNativePG Cluster (initdb bootstrap) and
#       by the MLflow chart (backendStore.existingDatabaseSecret).
#
# The RustFS artifact-bucket creds (rustfs-mlflow-creds) are NOT here:
# they are sealed alongside the other bucket keys in k8s/rustfs/secrets/
# and provisioned by the RustFS provisioning Job, mirroring bronze/silver/gold.
#
# The sealed file is generated with k8s/mlflow/secrets/seal.sh against
# your cluster's controller and committed here (safe: it is encrypted).
# sync-wave 1 runs before the Postgres Cluster (wave 2) so the owner
# Secret exists before initdb bootstrap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/aacecandev/medallion-mlops
    targetRevision: main
    path: k8s/mlflow/secrets
    directory:
      recurse: false
      include: "*-sealed.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
