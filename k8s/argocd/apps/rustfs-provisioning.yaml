# RustFS bucket + user provisioning.
# A Job (managed as an ArgoCD PostSync hook) creates the bronze/silver/
# gold buckets and, for each one, an access key scoped by a bucket-only
# policy. The per-bucket keys are read from the SealedSecret-delivered
# Secrets, so the Job only applies them to RustFS — it never generates or
# writes credentials (no secret-management RBAC needed).
# sync-wave 3 runs after RustFS is up (wave 2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs-provisioning
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/aacecandev/medallion-mlops
    targetRevision: main
    path: k8s/rustfs/provisioning
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: rustfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
