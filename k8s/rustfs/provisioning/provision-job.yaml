# Creates the medallion buckets and a bucket-scoped access key for each.
# Idempotent and re-runnable: re-adding a user updates it, policy/attach
# failures on "already exists" are ignored. Runs as an ArgoCD PostSync
# hook so it re-executes on every sync and is recreated cleanly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-provision-script
  namespace: rustfs
data:
  provision.sh: |
    #!/bin/sh
    set -eu

    # MinIO retired the dl.min.io binary path (HTTP 410) and gated the
    # minio/mc image, so pull mc from the GitHub release with a pinned
    # version + checksum. mc is MinIO-admin compatible and works against
    # RustFS (verified: bucket + user/policy management).
    MC=/tmp/mc
    MC_URL="https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z"
    MC_SHA256="01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
    echo "downloading mc client (pinned)..."
    wget -q -O "$MC" "$MC_URL"
    echo "${MC_SHA256}  ${MC}" | sha256sum -c -
    chmod +x "$MC"

    EP="${RUSTFS_ENDPOINT:-http://rustfs-svc.rustfs.svc.cluster.local:9000}"

    echo "waiting for rustfs at ${EP} ..."
    i=0
    until "$MC" alias set rt "$EP" "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" >/dev/null 2>&1; do
      i=$((i + 1))
      if [ "$i" -ge 60 ]; then
        echo "ERROR: rustfs not reachable after 5 minutes"
        exit 1
      fi
      sleep 5
    done
    echo "connected to rustfs."

    "$MC" mb --ignore-existing rt/bronze rt/silver rt/gold

    provision() {
      layer="$1"
      ak="$2"
      sk="$3"
      echo "provisioning ${layer} (user=${ak}) ..."
      cat > /tmp/${layer}.json <<EOF
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket"],"Resource":["arn:aws:s3:::${layer}","arn:aws:s3:::${layer}/*"]}]}
    EOF
      "$MC" admin policy create rt "${layer}-rw" /tmp/${layer}.json 2>/dev/null || true
      "$MC" admin user add rt "$ak" "$sk"
      "$MC" admin policy attach rt "${layer}-rw" --user "$ak" 2>/dev/null || true
    }

    provision bronze "$BRONZE_AK" "$BRONZE_SK"
    provision silver "$SILVER_AK" "$SILVER_SK"
    provision gold   "$GOLD_AK"   "$GOLD_SK"

    echo "done: buckets bronze/silver/gold provisioned with scoped keys."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-provision
  namespace: rustfs
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: rustfs-provision
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision
          image: alpine:3.20
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: RUSTFS_ENDPOINT
              value: http://rustfs-svc.rustfs.svc.cluster.local:9000
            # Root credentials (to administer RustFS).
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-root
                  key: RUSTFS_SECRET_KEY
            # Per-bucket access keys (declarative, from SealedSecrets).
            - name: BRONZE_AK
              valueFrom:
                secretKeyRef:
                  name: rustfs-bronze-creds
                  key: AWS_ACCESS_KEY_ID
            - name: BRONZE_SK
              valueFrom:
                secretKeyRef:
                  name: rustfs-bronze-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: SILVER_AK
              valueFrom:
                secretKeyRef:
                  name: rustfs-silver-creds
                  key: AWS_ACCESS_KEY_ID
            - name: SILVER_SK
              valueFrom:
                secretKeyRef:
                  name: rustfs-silver-creds
                  key: AWS_SECRET_ACCESS_KEY
            - name: GOLD_AK
              valueFrom:
                secretKeyRef:
                  name: rustfs-gold-creds
                  key: AWS_ACCESS_KEY_ID
            - name: GOLD_SK
              valueFrom:
                secretKeyRef:
                  name: rustfs-gold-creds
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: rustfs-provision-script
