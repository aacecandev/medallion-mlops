# LoadBalancer IP pool + L2 announcement policy for the LAN.
# Single-node homelab: Services of type LoadBalancer get an IP from
# this pool and are announced on the local network via ARP (L2).
---
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
spec:
  blocks:
    - start: 192.168.1.240
      stop: 192.168.1.250
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-l2-announce
spec:
  externalIPs: true
  loadBalancerIPs: true
  interfaces:
    - ^wlo1$
