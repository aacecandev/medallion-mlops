# Cilium CNI — eBPF datapath, replaces kube-proxy + flannel.
# https://docs.cilium.io/en/stable/
#
# NOTE: k8sServiceHost is NOT set here on purpose. k3s runs with
# --disable-kube-proxy, so Cilium must know how to reach the API
# server directly. The mise `network-install` task auto-detects the
# control-plane InternalIP and injects it via `--set k8sServiceHost=...`.
# When ArgoCD later adopts Cilium, pin that IP as a helm parameter in
# the Application (single-node homelab => the IP is stable).

kubeProxyReplacement: true
k8sServiceHost: "192.168.1.134"
k8sServicePort: 6443

operator:
  replicas: 1

ipam:
  mode: kubernetes

# L2 announcements for LoadBalancer Services (single-node homelab).
l2announcements:
  enabled: true

# eBPF-based host routing — faster than legacy, no iptables dependency.
routingMode: native
ipv4NativeRoutingCIDR: "10.42.0.0/16"
bpf:
  masquerade: true

# Hubble observability
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
